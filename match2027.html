<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Новогодний Матч</title>
<style>
 html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1030;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
 #cv{display:block;position:fixed;top:0;left:0}
 .btn{position:fixed;top:12px;z-index:5;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(20,25,60,.55);color:#fff;font-size:18px;line-height:37px;text-align:center;padding:0}
 #snd{right:10px}#fs{right:58px}
 #err{position:fixed;left:6px;right:6px;bottom:6px;z-index:99;display:none;background:#7a1020;color:#fff;font:12px/1.4 monospace;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="btn" id="snd">🔊</button>
<button class="btn" id="fs">⛶</button>
<div id="err"></div>
<script>
(function(){
var box=document.getElementById('err');
window.__showErr=function(m){box.style.display='block';box.textContent+='[ОШИБКА] '+m+'\n';};
window.addEventListener('error',function(e){__showErr(e.message+' (строка '+(e.lineno||'?')+')');});
})();
</script>
<script>
"use strict";
try{
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var sndBtn=document.getElementById('snd'),fsBtn=document.getElementById('fs');
var TAU=Math.PI*2;
var COLS=8,ROWS=8,NC=6;
var COLORS=['#ff5d73','#ffb648','#4fc46a','#4f8ef7','#9a6bff','#dceeff'];
var DARK=['#b52e42','#c07a1e','#2b7d41','#2b5cb0','#6a3fc0','#8fb8cf'];
var W=0,H=0,DPR=1,CS=40,bx=0,by=0,bs=0;
var grid=[],parts=[],floats=[],rings=[];
var score=0,best=0,state='idle',combo=0,comboT=0,selR=-1,selC=-1,shake=0,lastT=0;
var musicT=0,noteI=0,toastT=0,toastTxt='';
function loadBest(){try{return +(localStorage.getItem('nm_best')||0);}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem('nm_best',v);}catch(e){}}
best=loadBest();
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rand(a,b){return a+Math.random()*(b-a)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2.5);
 cv.width=W*DPR;cv.height=H*DPR;
 cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
 bs=Math.min(W*0.94,H*0.62);CS=bs/COLS;
 bx=(W-bs)/2;by=clamp((H-bs)/2,80,H-bs-40);
}
addEventListener('resize',resize);

function mkCell(r,c,forceColor){
 var v;
 if(forceColor!==undefined)v=forceColor;
 else{
  var ok=false,tries=0;
  while(!ok&&tries<30){
   v=Math.floor(Math.random()*NC);tries++;ok=true;
   if(c>=2&&grid[r][c-1]&&grid[r][c-2]&&grid[r][c-1].c===v&&grid[r][c-2].c===v)ok=false;
   if(r>=2&&grid[r-1][c]&&grid[r-2][c]&&grid[r-1][c].c===v&&grid[r-2][c].c===v)ok=false;
  }
 }
 return {c:v,fy:0,vy:0,sq:0,blink:rand(1,4),blinkT:0};
}
function initBoard(){
 grid=[];
 for(var r=0;r<ROWS;r++){grid.push([]);
  for(var c=0;c<COLS;c++)grid[r].push(null);
 }
 for(r=0;r<ROWS;r++)for(var c2=0;c2<COLS;c2++)grid[r][c2]=mkCell(r,c2);
 if(!hasAnyMove())initBoard();
}
function findMatches(){
 var m=[];
 for(var r=0;r<ROWS;r++){
  var c=0;
  while(c<COLS){
   var c2=c;
   while(c2+1<COLS&&grid[r][c2+1]&&grid[r][c]&&grid[r][c2+1].c===grid[r][c].c)c2++;
   if(c2-c+1>=3)for(var k=c;k<=c2;k++)m.push([r,k]);
   c=c2+1;
  }
 }
 for(var cc=0;cc<COLS;cc++){
  var rr2=0;
  while(rr2<ROWS){
   var r2=rr2;
   while(r2+1<ROWS&&grid[r2+1][cc]&&grid[rr2][cc]&&grid[r2+1][cc].c===grid[rr2][cc].c)r2++;
   if(r2-rr2+1>=3)for(var k2=rr2;k2<=r2;k2++)m.push([k2,cc]);
   rr2=r2+1;
  }
 }
 return m;
}
function swapCells(r1,c1,r2,c2){
 var t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t;
}
function hasAnyMove(){
 for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
  if(c+1<COLS){swapCells(r,c,r,c+1);var m=findMatches().length;swapCells(r,c,r,c+1);if(m)return true;}
  if(r+1<ROWS){swapCells(r,c,r+1,c);var m2=findMatches().length;swapCells(r,c,r+1,c);if(m2)return true;}
 }
 return false;
}
function gravity(){
 for(var c=0;c<COLS;c++){
  var write=ROWS-1;
  for(var r=ROWS-1;r>=0;r--){
   var o=grid[r][c];
   if(o){
    if(write!==r){grid[write][c]=o;grid[r][c]=null;o.fy=(r-write)*CS;o.vy=0;}
    write--;
   }
  }
  for(var r2=write;r2>=0;r2--){
   var n=mkCell(r2,c);
   n.fy=-(r2+1)*CS-CS*0.5;n.vy=0;
   grid[r2][c]=n;
  }
 }
}
function burst(x,y,col,n){
 for(var i=0;i<n;i++){var a=rand(0,TAU),s=rand(60,300);
  parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:rand(0.4,0.9),t:0,c:col,sz:rand(2,4.5),g:600,type:'s'});}
 rings.push({x:x,y:y,t:0,life:0.4,r0:6});
}
function popMatches(){
 var m=findMatches();
 if(!m.length)return false;
 combo++;comboT=1.4;
 var mult=Math.min(1+(combo-1)*0.5,4);
 for(var i=0;i<m.length;i++){
  var r=m[i][0],c=m[i][1],o=grid[r][c];
  if(!o)continue;
  var x=bx+c*CS+CS/2,y=by+r*CS+CS/2;
  burst(x,y,COLORS[o.c],12);
  var gain=Math.round(20*mult);
  score+=gain;
  floats.push({x:x,y:y,t:0,txt:'+'+gain});
  grid[r][c]=null;
 }
 if(score>best){best=score;saveBest(best);}
 beep(420+combo*70,0.18,'sine',0.15);
 shake=Math.min(shake+3,10);
 gravity();
 return true;
}
function trySwap(r1,c1,r2,c2){
 if(r2<0||r2>=ROWS||c2<0||c2>=COLS)return;
 var a=grid[r1][c1],b=grid[r2][c2];
 if(!a||!b)return;
 swapCells(r1,c1,r2,c2);
 if(findMatches().length){
  a.fy=(c2-c1)*CS*0.9+(r2-r1)*CS*0.9;a.fy=Math.abs(a.fy)*0.3;
  state='busy';combo=0;comboT=0;
 }else{
  swapCells(r1,c1,r2,c2);
  a.sq=0.25;b.sq=0.25;
  beep(140,0.12,'square',0.06);
 }
}
function update(dt,t){
 for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
  var o=grid[r][c];if(!o)continue;
  if(o.fy<0){o.vy+=5200*dt;o.fy+=o.vy*dt;
   if(o.fy>=0){o.fy=0;o.vy=0;o.sq=0.22;}}
  o.sq*=Math.exp(-dt*10);
  o.blink-=dt;
  if(o.blink<0){o.blinkT=0.13;o.blink=rand(2,5);}
  o.blinkT-=dt;
 }
 var busy=false;
 for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){if(grid[r][c]&&grid[r][c].fy<0){busy=true;break;}}
 if(state==='busy'&&!busy){
  if(!popMatches()){
   state='idle';combo=0;
   if(!hasAnyMove()){initBoard();toastTxt='Перемешиваем!';toastT=1.6;}
  }
 }
}
// ---------- ввод ----------
var pStart=null;
function cellAt(x,y){
 var c=Math.floor((x-bx)/CS),r=Math.floor((y-by)/CS);
 if(c<0||c>=COLS||r<0||r>=ROWS)return null;
 return {r:r,c:c};
}
function onDown(e){
 startAudio();
 var x=(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX);
 var y=(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY);
 if(state!=='idle'){pStart=null;return;}
 var cell=cellAt(x,y);
 if(!cell){pStart=null;return;}
 pStart={x:x,y:y,r:cell.r,c:cell.c};
 if(selR>=0&&(Math.abs(selR-cell.r)+Math.abs(selC-cell.c)===1)){
  trySwap(selR,selC,cell.r,cell.c);selR=-1;selC=-1;pStart=null;
 }else{selR=cell.r;selC=cell.c;}
 if(e.cancelable)e.preventDefault();
}
function onMove(e){
 if(!pStart||state!=='idle')return;
 var x=(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX);
 var y=(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY);
 var dx=x-pStart.x,dy=y-pStart.y;
 if(Math.abs(dx)>CS*0.45||Math.abs(dy)>CS*0.45){
  var r2=pStart.r,c2=pStart.c;
  if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1;
  trySwap(pStart.r,pStart.c,r2,c2);
  selR=-1;selC=-1;pStart=null;
 }
 if(e.cancelable)e.preventDefault();
}
function onUp(){pStart=null;}
if(window.PointerEvent){
 cv.addEventListener('pointerdown',onDown,{passive:false});
 cv.addEventListener('pointermove',onMove,{passive:false});
 cv.addEventListener('pointerup',onUp,{passive:false});
}else{
 cv.addEventListener('touchstart',onDown,{passive:false});
 cv.addEventListener('touchmove',onMove,{passive:false});
 cv.addEventListener('touchend',onUp,{passive:false});
 cv.addEventListener('mousedown',onDown);
 document.addEventListener('mousemove',onMove);
 document.addEventListener('mouseup',onUp);
}
sndBtn.addEventListener('click',function(){musicOn=!musicOn;sndBtn.textContent=musicOn?'🔊':'🔇';if(musicOn)startAudio();});
fsBtn.addEventListener('click',function(){
 try{
 if(document.fullscreenElement)document.exitFullscreen();
 else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
 }catch(e){}
});
// ---------- звук ----------
var AC=null,musicOn=true;
function startAudio(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
 if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function beep(f,dur,type,vol){
 if(!AC||!musicOn)return;
 try{
 var o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'triangle';o.frequency.value=f;
 g.gain.setValueAtTime(vol,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
 }catch(e){}
}
function bellS(v){
 if(!AC||!musicOn)return;
 try{
 var buf=AC.createBuffer(1,2205,44100),d=buf.getChannelData(0);
 for(var i=0;i<2205;i++)d[i]=(Math.random()*2-1)*(1-i/2205);
 var n=AC.createBufferSource();n.buffer=buf;
 var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=6200;f.Q.value=2;
 var g=AC.createGain();g.gain.value=v;
 n.connect(f);f.connect(g);g.connect(AC.destination);n.start();
 }catch(e){}
}
// ---------- музыка: «Хрустальный вечер» (собственная мелодия) ----------
var SPB=0.6,LOOP_BEATS=64;
var musBus=null,musEcho=null,musNoise=null,musEvents=[],musIdx=0,musBase=-1;
var CH={
 C:{pad:[48,55,64],bass:36,arp:[60,64,67,72]},
 g:{pad:[47,55,62],bass:47,arp:[59,62,67,71]},
 a:{pad:[45,52,60],bass:45,arp:[57,60,64,69]},
 f:{pad:[41,48,57],bass:41,arp:[57,60,65,69]},
 G:{pad:[43,50,59],bass:43,arp:[55,59,62,67]}
};
var PROG=['C','g','a','f','C','g','G','C','a','f','C','G','f','C','G','C'];
var MEL=[[0,76,1.5],[1.5,79,1.5],[3,81,1],[4,79,2],[6,76,1],[7,74,1],
[8,72,2],[10,76,1],[11,69,1],[12,72,1],[13,74,1],[14,72,2],
[16,76,1.5],[17.5,79,1.5],[19,81,1],[20,83,2],[22,79,1],[23,81,1],
[24,79,2],[26,76,1],[27,74,1],[28,72,3],
[32,76,1],[33,79,1],[34,81,2],[36,84,2],[38,83,1],[39,81,1],
[40,79,1.5],[41.5,76,1.5],[43,79,1],[44,81,2],[46,79,1],[47,76,1],
[48,81,1],[49,84,1],[50,83,2],[52,79,2],[54,76,1],[55,72,1],
[56,74,1],[57,76,1],[58,74,1],[59,71,1],[60,72,3]];
function m2f(m){return 440*Math.pow(2,(m-69)/12);}
function buildMusic(){
 musEvents=[];
 for(var i=0;i<MEL.length;i++)musEvents.push({v:'lead',b:MEL[i][0],m:MEL[i][1],d:MEL[i][2],vol:0.07});
 for(var bar=0;bar<16;bar++){
  var ch=CH[PROG[bar]],t0=bar*4,j;
  for(j=0;j<ch.pad.length;j++)musEvents.push({v:'pad',b:t0,m:ch.pad[j],d:4.6,vol:0.016});
  musEvents.push({v:'bass',b:t0,m:ch.bass,d:1.7,vol:0.055});
  musEvents.push({v:'bass',b:t0+2,m:ch.bass,d:1.7,vol:0.04});
  for(j=0;j<4;j++)musEvents.push({v:'arp',b:t0+0.5+j,m:ch.arp[j],d:0.5,vol:0.028});
 }
 musEvents.push({v:'bell',b:14,m:89,vol:0.05});
 musEvents.push({v:'bell',b:14.5,m:96,vol:0.03});
 musEvents.push({v:'bell',b:30,m:84,vol:0.05});
 musEvents.push({v:'bell',b:30.5,m:91,vol:0.03});
 musEvents.push({v:'bell',b:46,m:91,vol:0.05});
 musEvents.push({v:'bell',b:46.5,m:96,vol:0.03});
 musEvents.push({v:'bell',b:60,m:84,vol:0.05});
 musEvents.push({v:'bell',b:60.5,m:91,vol:0.03});
 // ударная секция: ручейки вливаются в реку
 for(var bar=0;bar<16;bar++){
  var t0=bar*4,j;
  if(bar>=4){
   for(j=0;j<4;j++)musEvents.push({v:'hat',b:t0+j+0.5,d:0.06,vol:0.02});
  }
  if(bar>=8){
   for(j=0;j<4;j++)musEvents.push({v:'hat',b:t0+j,d:0.07,vol:0.018});
   musEvents.push({v:'kick',b:t0,vol:0.16});
   musEvents.push({v:'kick',b:t0+2,vol:0.12});
   musEvents.push({v:'snare',b:t0+1,vol:0.06});
   musEvents.push({v:'snare',b:t0+3,vol:0.06});
  }
  if(bar>=12){
   musEvents.push({v:'kick',b:t0+2.75,vol:0.1});
   musEvents.push({v:'snare',b:t0+3.5,vol:0.03});
   musEvents.push({v:'hat',b:t0+3,d:0.3,vol:0.03});
   for(j=0;j<4;j+=2)musEvents.push({v:'ride',b:t0+j,vol:0.014});
   if(bar===12)musEvents.push({v:'crash',b:t0,vol:0.1});
   if(bar===15)musEvents.push({v:'crash',b:t0+3.5,vol:0.09});
  }
 }
 musEvents.sort(function(a,b){return a.b-b.b;});
}
function setupMus(){
 musBus=AC.createGain();musBus.gain.value=1;musBus.connect(AC.destination);
 musEcho=AC.createGain();musEcho.gain.value=0.85;
 var dl=AC.createDelay(1);dl.delayTime.value=SPB*0.75;
 var fb=AC.createGain();fb.gain.value=0.3;
 var wet=AC.createGain();wet.gain.value=0.2;
 musEcho.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination);
 if(!musNoise){
  var nb=AC.createBuffer(1,44100,44100),nd=nb.getChannelData(0);
  for(var ni=0;ni<44100;ni++)nd[ni]=Math.random()*2-1;
  musNoise=nb;
 }
}
function playEv(ev,t){
 try{
 var f=m2f(ev.m),d=ev.d*SPB,g,o;
 if(ev.v==='lead'){
  for(var k=0;k<2;k++){
   o=AC.createOscillator();g=AC.createGain();
   o.type='sine';o.frequency.value=f*(k?1.004:0.996);
   g.gain.setValueAtTime(0,t);
   g.gain.linearRampToValueAtTime(ev.vol,t+0.05);
   g.gain.setValueAtTime(ev.vol,t+d*0.6);
   g.gain.exponentialRampToValueAtTime(0.001,t+d+0.3);
   o.connect(g);g.connect(musBus);
   o.start(t);o.stop(t+d+0.35);
  }
 }else if(ev.v==='pad'){
  o=AC.createOscillator();g=AC.createGain();
  var fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=850;
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(ev.vol,t+0.9);
  g.gain.setValueAtTime(ev.vol,t+d-0.9);
  g.gain.linearRampToValueAtTime(0.0001,t+d);
  o.connect(fl);fl.connect(g);g.connect(musBus);
  o.start(t);o.stop(t+d+0.1);
 }else if(ev.v==='bass'){
  o=AC.createOscillator();g=AC.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(ev.vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(musBus);
  o.start(t);o.stop(t+d+0.1);
 }else if(ev.v==='arp'){
  o=AC.createOscillator();g=AC.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(ev.vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  o.connect(g);g.connect(musEcho);
  o.start(t);o.stop(t+0.6);
 }else if(ev.v==='bell'){
  var parts=[[1,1,1.8],[2.756,0.4,1.0],[5.404,0.15,0.55]];
  for(var i=0;i<parts.length;i++){
   o=AC.createOscillator();g=AC.createGain();
   o.type='sine';o.frequency.value=f*parts[i][0];
   g.gain.setValueAtTime(ev.vol*parts[i][1],t);
   g.gain.exponentialRampToValueAtTime(0.0005,t+parts[i][2]);
   o.connect(g);g.connect(musBus);g.connect(musEcho);
   o.start(t);o.stop(t+parts[i][2]+0.1);
  }
 }else if(ev.v==='kick'){
  o=AC.createOscillator();g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(ev.vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g);g.connect(musBus);
  o.start(t);o.stop(t+0.32);
 }else if(ev.v==='snare'){
  var sn=AC.createBufferSource();sn.buffer=musNoise;
  var sf=AC.createBiquadFilter();sf.type='bandpass';sf.frequency.value=1800;sf.Q.value=0.9;
  g=AC.createGain();
  g.gain.setValueAtTime(ev.vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  sn.connect(sf);sf.connect(g);g.connect(musBus);g.connect(musEcho);
  var bo=AC.createOscillator(),bg=AC.createGain();
  bo.type='triangle';bo.frequency.value=190;
  bg.gain.setValueAtTime(ev.vol*0.5,t);
  bg.gain.exponentialRampToValueAtTime(0.001,t+0.1);
  bo.connect(bg);bg.connect(musBus);
  sn.start(t);sn.stop(t+0.2);bo.start(t);bo.stop(t+0.12);
 }else if(ev.v==='hat'){
  var hn=AC.createBufferSource();hn.buffer=musNoise;
  var hf=AC.createBiquadFilter();hf.type='highpass';hf.frequency.value=7500;
  g=AC.createGain();
  g.gain.setValueAtTime(ev.vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+ev.d);
  hn.connect(hf);hf.connect(g);g.connect(musBus);
  hn.start(t);hn.stop(t+ev.d+0.05);
 }else if(ev.v==='ride'){
  var rn=AC.createBufferSource();rn.buffer=musNoise;
  var rf=AC.createBiquadFilter();rf.type='bandpass';rf.frequency.value=4500;rf.Q.value=1.5;
  g=AC.createGain();
  g.gain.setValueAtTime(ev.vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
  rn.connect(rf);rf.connect(g);g.connect(musBus);g.connect(musEcho);
  rn.start(t);rn.stop(t+1.2);
 }else if(ev.v==='crash'){
  var cn=AC.createBufferSource();cn.buffer=musNoise;
  var cf=AC.createBiquadFilter();cf.type='highpass';cf.frequency.value=3500;
  g=AC.createGain();
  g.gain.setValueAtTime(ev.vol,t);
  g.gain.exponentialRampToValueAtTime(0.0005,t+1.8);
  cn.connect(cf);cf.connect(g);g.connect(musBus);g.connect(musEcho);
  cn.start(t);cn.stop(t+2.0);
 }
 }catch(e){}
}
function musicTick(dt){
 if(!AC||!musicOn)return;
 if(!musBus)setupMus();
 if(!musEvents.length)buildMusic();
 var now=AC.currentTime;
 if(musBase<0)musBase=now+0.2;
 else if(now-musBase>LOOP_BEATS*SPB+3){musBase=now+0.15;musIdx=0;}
 while(musIdx<musEvents.length){
  var ev=musEvents[musIdx],t=musBase+ev.b*SPB;
  if(t>now+0.25)break;
  if(t>=now-0.05)playEv(ev,t);
  musIdx++;
 }
 if(musIdx>=musEvents.length){musBase+=LOOP_BEATS*SPB;musIdx=0;}
}
// ---------- фон ----------
var stars=[],snow=[],lights=[];
(function(){
 for(var i=0;i<60;i++)stars.push({x:Math.random(),y:Math.random()*0.5,s:rand(0.5,1.8),p:rand(0,TAU)});
 for(i=0;i<110;i++)snow.push({x:Math.random(),y:Math.random(),r:rand(1,2.8),v:rand(16,55),ph:rand(0,TAU),l:i%2});
 for(i=0;i<14;i++)lights.push({x:Math.random(),y:Math.random(),r:rand(16,44),v:rand(4,10),c:['#ffb3c6','#ffd88a','#9fd8ff','#c7aaff'][i%4],p:rand(0,TAU)});
})();
function drawBg(t){
 var g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#0a0e2a');g.addColorStop(1,'#2c2050');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.13;
 for(var i=0;i<3;i++){ctx.beginPath();
  for(var x=0;x<=W+24;x+=24)ctx.lineTo(x,H*(0.18+i*0.07)+Math.sin(x*0.008+t*0.6+i*2)*28);
  ctx.lineWidth=32-i*8;ctx.strokeStyle=['#57f0b0','#5fc9ff','#c07bff'][i];ctx.stroke();}
 ctx.restore();
 for(i=0;i<stars.length;i++){var s=stars[i];
  ctx.globalAlpha=0.3+0.6*Math.abs(Math.sin(t*1.3+s.p));
  ctx.fillStyle='#fff';ctx.fillRect(s.x*W,s.y*H,s.s,s.s);}
 ctx.globalAlpha=1;
 ctx.fillStyle='#141b40';ctx.beginPath();ctx.moveTo(0,H);
 for(x=0;x<=W;x+=24)ctx.lineTo(x,H*0.32+Math.sin(x*0.006)*24);
 ctx.lineTo(W,H);ctx.closePath();ctx.fill();
 for(i=0;i<lights.length;i++){var b=lights[i];b.y-=b.v*0.0008;if(b.y<-0.05)b.y=1.05;
  ctx.save();ctx.globalAlpha=0.08;ctx.fillStyle=b.c;
  ctx.beginPath();ctx.arc(b.x*W+Math.sin(t*0.4+b.p)*20,b.y*H,b.r,0,TAU);ctx.fill();ctx.restore();}
 ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.beginPath();
 for(x=0;x<=W;x+=30)ctx.lineTo(x,10+Math.sin(x*0.02)*6);
 ctx.stroke();
 for(i=0;i<14;i++){var lx=(i+0.5)/14*W,ly=16+Math.sin(lx*0.02)*6;
  ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle='hsl('+((i*53+t*70)%360)+',90%,65%)';
  ctx.beginPath();ctx.arc(lx,ly,3,0,TAU);ctx.fill();
  ctx.globalAlpha=0.18;ctx.beginPath();ctx.arc(lx,ly,7,0,TAU);ctx.fill();ctx.restore();}
}
function drawSnow(dt){
 for(var i=0;i<snow.length;i++){var s=snow[i];
  s.y+=s.v*dt/H;s.x+=Math.sin(s.y*9+s.ph)*0.0004;
  if(s.y>1.02){s.y=-0.02;s.x=Math.random();}
  ctx.globalAlpha=s.l?0.8:0.4;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;
}
// ---------- шарики ----------
function shade(hex,amt){
 var n=parseInt(hex.slice(1),16);
 var r=clamp((n>>16)+amt,0,255),g=clamp((n>>8&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
 return 'rgb('+r+','+g+','+b+')';
}
function drawBall(x,y,color,colIdx,r,sq,blinkT){
 var k=1+(sq||0)*0.5,sqy=1-(sq||0)*0.5;
 ctx.save();ctx.translate(x,y);ctx.scale(k,sqy);
 var g=ctx.createRadialGradient(-r*0.35,-r*0.45,r*0.1,0,0,r);
 g.addColorStop(0,shade(color,70));g.addColorStop(0.35,color);g.addColorStop(1,shade(color,-60));
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
 // узор-впадина ёлочного шара
 ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=r*0.1;
 ctx.beginPath();ctx.moveTo(-r*0.6,-r*0.45);ctx.quadraticCurveTo(0,-r*0.9,r*0.6,-r*0.45);ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,0.8)';
 ctx.beginPath();ctx.ellipse(-r*0.35,-r*0.42,r*0.2,r*0.12,-0.7,0,TAU);ctx.fill();
 // мордочка
 var r2=r*0.8;
 ctx.fillStyle='#2e2030';
 if(blinkT>0){
  ctx.strokeStyle='#2e2030';ctx.lineWidth=Math.max(1.4,r2*0.1);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(-r2*0.32,-r2*0.1,r2*0.14,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  ctx.beginPath();ctx.arc(r2*0.32,-r2*0.1,r2*0.14,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
 }else{
  ctx.beginPath();ctx.ellipse(-r2*0.32,-r2*0.1,r2*0.12,r2*0.16,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(r2*0.32,-r2*0.1,r2*0.12,r2*0.16,0,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-r2*0.27,-r2*0.17,r2*0.05,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(r2*0.37,-r2*0.17,r2*0.05,0,TAU);ctx.fill();
 }
 ctx.strokeStyle='#2e2030';ctx.lineWidth=Math.max(1.3,r2*0.08);ctx.lineCap='round';
 ctx.beginPath();ctx.arc(0,r2*0.05,r2*0.22,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
 ctx.fillStyle='rgba(255,110,130,0.35)';
 ctx.beginPath();ctx.arc(-r2*0.58,r2*0.1,r2*0.14,0,TAU);ctx.fill();
 ctx.beginPath();ctx.arc(r2*0.58,r2*0.1,r2*0.14,0,TAU);ctx.fill();
 // шапочка с петлёй
 ctx.fillStyle='#d7dbe6';
 rr(-r*0.16,-r-r*0.22,r*0.32,r*0.22,r*0.05);ctx.fill();
 ctx.strokeStyle='#f5c542';ctx.lineWidth=Math.max(1.4,r*0.06);
 ctx.beginPath();ctx.arc(0,-r-r*0.3,r*0.13,Math.PI,TAU);ctx.stroke();
 ctx.restore();
}
function drawBoard(t){
 // панель
 ctx.fillStyle='rgba(16,20,52,0.6)';
 rr(bx-10,by-10,bs+20,bs+20,14);ctx.fill();
 ctx.strokeStyle='#5a4a86';ctx.lineWidth=2;
 rr(bx-10,by-10,bs+20,bs+20,14);ctx.stroke();
 // шахматка
 for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
  if((r+c)%2===0){ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(bx+c*CS,by+r*CS,CS,CS);}
 }
 if(selR>=0){
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;
  rr(bx+selC*CS+3,by+selR*CS+3,CS-6,CS-6,8);ctx.stroke();
 }
 for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
  var o=grid[r][c];if(!o)continue;
  var x=bx+c*CS+CS/2,y=by+r*CS+CS/2+o.fy;
  if(y<by-CS)continue;
  var pr=CS*0.40;
  ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(bx+c*CS+CS/2,by+r*CS+CS*0.88,pr*0.8,pr*0.16,0,0,TAU);ctx.fill();ctx.restore();
  drawBall(x,y,COLORS[o.c],o.c,pr,o.sq,o.blinkT);
 }
}
function drawFx(dt,t){
 for(var i=0;i<parts.length;i++){var p=parts[i];
  p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;
  ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;
  ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,TAU);ctx.fill();}
 var alive=[];for(i=0;i<parts.length;i++)if(parts[i].t<parts[i].life)alive.push(parts[i]);
 parts=alive;ctx.globalAlpha=1;
 for(i=0;i<rings.length;i++){var rg=rings[i];rg.t+=dt;var k=rg.t/rg.life;
  ctx.globalAlpha=1-k;ctx.strokeStyle='#fff';ctx.lineWidth=3*(1-k)+0.5;
  ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r0+k*CS*1.6,0,TAU);ctx.stroke();}
 alive=[];for(i=0;i<rings.length;i++)if(rings[i].t<rings[i].life)alive.push(rings[i]);
 rings=alive;
 for(i=0;i<floats.length;i++){var f=floats[i];f.t+=dt;
  ctx.globalAlpha=Math.max(0,1-f.t/0.9);
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffd23f';ctx.textAlign='center';
  ctx.fillText(f.txt,f.x,f.y-f.t*44);}
 alive=[];for(i=0;i<floats.length;i++)if(floats[i].t<0.9)alive.push(floats[i]);
 floats=alive;ctx.globalAlpha=1;
}
function drawUI(t){
 ctx.textAlign='left';
 ctx.font='bold 32px sans-serif';
 ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=6;
 ctx.fillStyle='#fff';ctx.fillText(String(score),18,46);
 ctx.shadowBlur=0;
 ctx.font='14px sans-serif';ctx.fillStyle='rgba(255,255,255,0.6)';
 ctx.fillText('рекорд: '+best,18,68);
 if(combo>1&&comboT>0){
  var k=1+Math.sin(t*12)*0.08;
  ctx.save();ctx.translate(18,100);ctx.scale(k,k);
  ctx.font='bold 22px sans-serif';ctx.fillStyle='#ffd23f';
  ctx.fillText('КОМБО ×'+Math.min(4,1+(combo-1)*0.5).toFixed(1),0,0);
  ctx.restore();
 }
 if(toastT>0){
  toastT-=1/60;
  ctx.globalAlpha=Math.min(1,toastT);
  ctx.font='bold 22px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText(toastTxt,W/2,by-24);
  ctx.globalAlpha=1;
 }
 ctx.textAlign='center';
 ctx.font='15px sans-serif';ctx.fillStyle='rgba(255,255,255,0.75)';
 ctx.fillText('Свайпни шарик — собери три одинаковых',W/2,H-24);
}
function loop(ts){
 var t=ts/1000;
 var dt=Math.min(0.033,lastT?t-lastT:0.016);lastT=t;
 try{
 musicTick(dt);
 comboT-=dt;if(comboT<=0)combo=0;
 if(shake>0)shake*=Math.exp(-dt*8);
 ctx.save();
 if(shake>0.3)ctx.translate(rand(-shake,shake)*0.5,rand(-shake,shake)*0.5);
 drawBg(t);
 update(dt,t);
 drawBoard(t);
 drawFx(dt,t);
 drawSnow(dt);
 ctx.restore();
 drawUI(t);
 }catch(e){__showErr(e.message);}
 requestAnimationFrame(loop);
}
resize();
initBoard();
requestAnimationFrame(loop);
window.__booted=true;
}catch(e){if(window.__showErr)__showErr('СТАРТ: '+e.message);}
</script>
